# Shared across the Hasht apps (this one plus future iOS/Android clients),
# not a typo for something more Electron-specific — this ships in the code
# signature / macOS keychain entries, so it's not a cosmetic rename later.
appId: net.hasht.app
copyright: Copyright © 2026 Hasht LLC
productName: Hasht
directories:
  output: release

# Ad-hoc signs unsigned macOS builds so a downloaded .app isn't rejected as
# "damaged". See the file for why this is needed and what it does not fix.
afterPack: build/afterPack.js
files:
  - dist/**/*
  - src/renderer-picker/**/*
  - build/**/*
  # Icon Composer design source (Xcode/macOS 26 asset), not something the app
  # needs at runtime — keep it out of every installer.
  - "!build/hasht.icon/**/*"

# Deep-link scheme the browser sign-in handoff calls back on.
protocols:
  - name: Hasht Desktop
    schemes: [hasht]

mac:
  icon: build/hasht.icon
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # electron-builder drops the arch suffix from the x64 filename by default
  # (it's treated as "the default arch"), so the Intel build ends up as an
  # unlabeled `Hasht-<version>.dmg` sitting next to the clearly-labeled
  # `Hasht-<version>-arm64.dmg` — easy to grab by mistake on an Apple Silicon
  # Mac and get the "needs Rosetta" prompt. Force the arch onto every name.
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    # Restrict macOS 26 code AutoFill to explicitly marked one-time-code fields.
    NSAutoFillRequiresTextContentTypeForOneTimeCodeOnMac: true
    NSMicrophoneUsageDescription: Hasht needs microphone access for voice chat.
    NSCameraUsageDescription: Hasht needs camera access for voice chat.
    # Without it macOS hands over an ended audio track when a screen share
    # asks for system audio, with no error.
    NSAudioCaptureUsageDescription: Hasht shares your computer's audio when you share your screen in a call.
    # Required for passkeys signed in on a phone (caBLE talks over BLE).
    NSBluetoothAlwaysUsageDescription: Hasht uses Bluetooth to sign in with a passkey on a nearby device.
  # CI signs with Developer ID and notarizes through the Apple team API key.
  # prepare-macos-signing.py provides the APPLE_API_* environment variables.

dmg:
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Transparent mark with native shell/DPI sizes; generated by
  # scripts/generate-desktop-icons.py rather than resizing a mobile icon.
  icon: build/icon.ico
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (or use Azure Trusted
  # Signing) in CI — unsigned builds trigger SmartScreen warnings.

linux:
  # Match Electron's app_id/WM_CLASS to the launcher for taskbar icon lookup.
  syncDesktopName: true
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    # Plain tarball: what the AUR package unpacks. Arch has no native format
    # of its own to build here — a PKGBUILD fetches this.
    - target: tar.gz
      arch: [x64, arm64]
  category: Network
  # The tarball carries no icon otherwise, and the AUR package has to install
  # one (a private repo can't be fetched from a PKGBUILD).
  extraResources:
    - from: build/icon.png
      to: icon.png
  # deb and rpm both require a Maintainer field. Overrides the `author` derived
  # default with the company contact.
  maintainer: Hasht LLC <hello@hasht.net>
  synopsis: Hasht desktop client for the self-hosted chat app
  description: |
    Thin desktop shell for the self-hosted chat app. Connects to a server you
    configure, with a tray icon, unread badges and background operation.

publish:
  provider: github
  owner: Hasht-net
  repo: hasht-desktop
  # Load-bearing. The publisher defaults to "draft", and on finding an
  # already-published release it logs a warning and uploads NOTHING — the
  # build still exits 0, so the release just ends up empty. Our workflow runs
  # on `release: published`, so the release is always already published.
  releaseType: release
  # Baked into app-update.yml for electron-updater. The public GitHub feed
  # supplies signed macOS ZIP updates and Windows/Linux update artifacts.
  # Both ZIP and DMG targets must remain enabled for Squirrel.Mac updates.
