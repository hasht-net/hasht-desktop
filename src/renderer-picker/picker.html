<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Welcome to Hasht</title>
    <style>
      /* Tokens copied from hasht-chat (frontend/src/style.css) and its sign-in
         screen, the same set hasht-app's picker uses (src/bootstrap.css there),
         so the picker and an instance's sign-in look like one app. Keep the
         three in step by hand. Follows the system theme. */
      @font-face {
        font-family: "Manrope Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url(fonts/manrope-latin-wght-normal.woff2) format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Manrope Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url(fonts/manrope-latin-ext-wght-normal.woff2) format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
          U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --font-ui: "Manrope Variable", "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --brand: #414fd4;
        --brand-hover: #313aa0;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --glass-blur: blur(24px) saturate(180%);
        --bg-rail: #0e0f11;
        --bg-input: #24262b;
        --bg-hover: rgba(78, 80, 88, 0.42);
        --border-strong: rgba(255, 255, 255, 0.16);
        --brand-text: #99a2f5;
        --danger: #f23f43;
        --danger-text: #f8797c;
        --text-normal: #dbdee1;
        --text-bright: #f2f3f5;
        --text-muted: #a2a8b1;
        --glass-bg: rgba(10, 10, 12, 0.6);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 12px 40px -8px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-rail: #e8eaec;
          --bg-input: #ebedef;
          --bg-hover: rgba(6, 6, 7, 0.06);
          --border-strong: rgba(6, 6, 7, 0.32);
          --brand-text: #414fd4;
          --danger-text: #c62a2e;
          --text-normal: #060607;
          --text-bright: #060607;
          --text-muted: #3d3f45;
          --glass-bg: rgba(255, 255, 255, 0.78);
          --glass-border: rgba(0, 0, 0, 0.12);
          --glass-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 12px 40px -8px rgba(0, 0, 0, 0.3);
          color-scheme: light;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font: 14px/1.5 var(--font-ui);
        background: var(--bg-rail);
        color: var(--text-normal);
        padding: 32px 24px;
        overflow-y: auto;
      }
      /* The sign-in screen's brand-tinted blobs, so the glass has something to blur. */
      body::before {
        content: "";
        position: fixed;
        inset: -25%;
        z-index: 0;
        background:
          radial-gradient(38% 42% at 22% 28%, color-mix(in srgb, var(--brand) 45%, transparent), transparent 70%),
          radial-gradient(42% 46% at 80% 72%, color-mix(in srgb, var(--brand) 32%, transparent), transparent 72%),
          radial-gradient(30% 34% at 62% 15%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%);
        filter: blur(64px);
        pointer-events: none;
      }
      [hidden] { display: none !important; }
      .wrap { position: relative; z-index: 1; max-width: 400px; margin: 0 auto; }
      .brand { text-align: center; margin-bottom: 18px; }
      .brand img {
        width: 52px;
        height: 52px;
        border-radius: var(--radius-md);
        display: block;
        margin: 0 auto 12px;
        filter: drop-shadow(0 8px 22px color-mix(in srgb, var(--brand) 40%, transparent));
      }
      h1 { font-size: 20px; font-weight: 800; color: var(--text-bright); margin: 0 0 2px; }
      .tagline { font-size: 13px; color: var(--text-muted); margin: 0; }
      .panel {
        border-radius: var(--radius-lg);
        padding: 12px;
        margin-bottom: 12px;
        background-color: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
      }
      h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 2px 4px 8px;
      }
      /* The spacing lives on the row, so the heading and "+" share one center line. */
      .panel-head { display: flex; align-items: center; justify-content: space-between; margin: -4px -4px 6px 0; }
      .panel-head h2 { margin: 0 4px; line-height: 1; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        flex: none;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text-muted);
        cursor: pointer;
      }
      .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--bg-hover); color: var(--text-bright); }
      .icon-btn svg { width: 18px; height: 18px; fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .icon-btn.more svg { stroke: none; }
      .add-toggle svg { transition: transform 0.15s ease; }
      .add-toggle[aria-expanded="true"] svg { transform: rotate(45deg); }

      .servers { display: grid; gap: 6px; }
      .server { border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-input); }
      .server[data-active="true"] { border-color: var(--brand-text); }
      .server-head { display: flex; align-items: center; gap: 4px; padding: 3px 5px 3px 0; }
      .meta {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 1px;
        text-align: left;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 7px 4px 7px 12px;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .meta:hover .name { color: var(--brand-text); }
      .name { font-weight: 700; color: var(--text-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub { display: flex; gap: 6px; font-size: 12px; color: var(--text-muted); min-width: 0; }
      .sub .account { color: var(--text-normal); font-weight: 600; white-space: nowrap; }
      .sub .account.signed-out { color: var(--text-muted); font-weight: 500; }
      .sub .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub .host::before { content: "·"; margin-right: 6px; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 10px 10px 12px; }
      .actions .confirm { flex-basis: 100%; margin: 0 0 2px; font-size: 13px; }
      .chip {
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: transparent;
        color: var(--text-bright);
        cursor: pointer;
      }
      .chip:hover { background: var(--bg-hover); }
      .chip.danger { color: var(--danger-text); }
      .chip.danger-fill { background: var(--danger); border-color: transparent; color: #fff; }
      .chip.primary-chip { background: var(--brand); border-color: transparent; color: #fff; }
      .rename { display: flex; gap: 6px; width: 100%; }
      .rename input { flex: 1; min-width: 0; padding: 5px 9px; }

      .card {
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-input);
        margin-bottom: 6px;
        cursor: pointer;
      }
      .card:last-child { margin-bottom: 0; }
      .card:hover, .card.selected { border-color: var(--brand-text); }
      .card-head { padding: 10px 12px; }
      .card-title { font-weight: 700; color: var(--text-bright); display: flex; align-items: center; gap: 8px; }
      .card-sub { font-size: 12.5px; color: var(--text-muted); }
      .badge {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--brand-text);
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 0 6px;
        line-height: 1.6;
      }
      .card-body { display: none; flex-direction: column; gap: 8px; padding: 0 12px 12px; cursor: default; }
      .card.selected .card-body { display: flex; }
      input {
        font: inherit;
        width: 100%;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--bg-rail);
        color: var(--text-normal);
      }
      input:focus { outline: none; border-color: var(--brand-text); }
      button.primary {
        font: inherit;
        font-weight: 700;
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      button.primary:hover { background: var(--brand-hover); }
      button.primary:disabled { opacity: 0.55; cursor: default; }
      #error { color: var(--danger-text); font-size: 12.5px; min-height: 16px; text-align: center; }
      @media (prefers-reduced-motion: reduce) {
        .add-toggle svg { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img src="logo.png" alt="" />
        <h1 id="headline">Welcome to Hasht</h1>
        <p id="tagline" class="tagline">Choose how you want to connect.</p>
      </div>

      <section id="servers-section" class="panel" hidden>
        <div class="panel-head">
          <h2>Your servers</h2>
          <button
            id="add-toggle"
            class="icon-btn add-toggle"
            type="button"
            aria-label="Add a server"
            title="Add a server"
            aria-expanded="false"
            aria-controls="add-section"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <div id="servers" class="servers"></div>
      </section>

      <section id="add-section" class="panel">
        <h2 id="add-heading">Connect</h2>

        <div class="card" id="card-hosted" data-choice="hosted">
          <div class="card-head">
            <div class="card-title">Hasht Cloud <span class="badge">Hosted</span></div>
            <div class="card-sub">Sign in at chat.hasht.net. Nothing to run yourself.</div>
          </div>
          <div class="card-body">
            <button class="primary" id="hosted-connect">Continue to Hasht</button>
          </div>
        </div>

        <div class="card" id="card-selfhosted" data-choice="selfhosted">
          <div class="card-head">
            <div class="card-title">Self-hosted</div>
            <div class="card-sub">Connect to a Hasht server you or your team runs.</div>
          </div>
          <div class="card-body">
            <input id="url" type="text" placeholder="chat.example.com" aria-label="Server address" />
            <input id="name" type="text" placeholder="Label (optional)" aria-label="Label" />
            <button class="primary" id="selfhosted-connect">Connect</button>
          </div>
        </div>
      </section>

      <div id="error"></div>
    </div>

    <script src="picker.js"></script>
  </body>
</html>
